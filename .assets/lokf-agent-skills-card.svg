<svg width="720" height="528" viewBox="0 0 720 528" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>lokf-agent-skills overview, compact card style</title>
<desc>Titled lokf-agent-skills. Open Knowledge Format labels the OKF card and Linked Open Knowledge Format labels the LOKF card in the top panel; OKF, plain markdown with prose and structure, flows into LOKF, which adds meaning, schema validity, and tools. LOKF, librarian, and docent are green, the roles that build, maintain, and serve knowledge. Curator is blue, the role where a person confirms trust. OKF stays plain as the raw, unprocessed material. A legend explains all three colors.</desc>

<rect width="720" height="528" fill="#ffffff"/>

<text x="360" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2C2C2A">lokf-agent-skills</text>

<!-- Panel 1 -->
<rect x="70" y="50" width="580" height="190" rx="20" fill="#F1EFE8"/>
<text x="185" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2C2C2A">Open Knowledge Format</text>
<text x="520" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#27500A">Linked Open Knowledge Format</text>

<!-- OKF card (plain) -->
<rect x="110" y="104" width="150" height="94" rx="12" fill="#ffffff" stroke="#D3D1C7" stroke-width="1"/>
<g transform="translate(185,132)" stroke="#5F5E5A" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <rect x="-9" y="-11" width="18" height="22" rx="2"/>
  <line x1="-5" y1="-3" x2="5" y2="-3"/>
  <line x1="-5" y1="2" x2="5" y2="2"/>
  <line x1="-5" y1="7" x2="2" y2="7"/>
</g>
<text x="185" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">OKF</text>
<text x="185" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">prose + structure</text>

<!-- Arrow -->
<line x1="268" y1="151" x2="402" y2="151" stroke="#888780" stroke-width="1.3"/>
<path d="M396 145 L404 151 L396 157" fill="none" stroke="#888780" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

<!-- LOKF card (green) -->
<rect x="410" y="104" width="220" height="94" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<g transform="translate(520,132)" stroke="#27500A" stroke-width="1.3" fill="none" stroke-linecap="round">
  <line x1="-8" y1="6" x2="0" y2="-8"/>
  <line x1="8" y1="6" x2="0" y2="-8"/>
  <line x1="-8" y1="6" x2="8" y2="6"/>
  <circle cx="0" cy="-8" r="3" fill="#EAF3DE"/>
  <circle cx="-8" cy="6" r="3" fill="#EAF3DE"/>
  <circle cx="8" cy="6" r="3" fill="#EAF3DE"/>
</g>
<text x="520" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#27500A">LOKF</text>
<text x="520" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#27500A">+ meaning + schema-valid + tools</text>

<!-- connector arrow -->
<line x1="360" y1="240" x2="360" y2="262" stroke="#888780" stroke-width="1.3"/>
<path d="M354 256 L360 264 L366 256" fill="none" stroke="#888780" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

<!-- Panel 2 -->
<rect x="20" y="276" width="680" height="196" rx="20" fill="#F1EFE8"/>
<text x="40" y="306" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Knowledge generation process skills</text>

<!-- Librarian card (green) -->
<rect x="60" y="340" width="140" height="104" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<g transform="translate(130,370)" stroke="#27500A" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <rect x="-10" y="-9" width="20" height="18" rx="2"/>
  <line x1="0" y1="-9" x2="0" y2="9"/>
</g>
<text x="130" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#27500A">Librarian</text>
<text x="130" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#27500A">Binds it into order</text>

<!-- Curator card (blue) -->
<rect x="290" y="340" width="140" height="104" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
<g transform="translate(360,370)" stroke="#0C447C" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <line x1="0" y1="-10" x2="0" y2="8"/>
  <line x1="-10" y1="-10" x2="10" y2="-10"/>
  <circle cx="-10" cy="-4" r="3" fill="#E6F1FB"/>
  <circle cx="10" cy="-4" r="3" fill="#E6F1FB"/>
  <line x1="-6" y1="8" x2="6" y2="8"/>
</g>
<text x="360" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0C447C">Curator</text>
<text x="360" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0C447C">Holds the scales</text>

<!-- Docent card (green) -->
<rect x="520" y="340" width="140" height="104" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<g transform="translate(590,368)" stroke="#27500A" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="0" cy="0" r="10"/>
  <polygon points="0,-6 3,0 0,6 -3,0" fill="#27500A" stroke="none"/>
</g>
<text x="590" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#27500A">Docent</text>
<text x="590" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#27500A">Guides the visitors</text>

<!-- Legend -->
<circle cx="70" cy="498" r="5" fill="#ffffff" stroke="#5F5E5A" stroke-width="1"/>
<text x="81" y="502" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">raw / unprocessed</text>
<circle cx="224" cy="498" r="5" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="235" y="502" font-family="Arial, sans-serif" font-size="12" fill="#27500A">builds, maintains, serves knowledge</text>
<circle cx="502" cy="498" r="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="513" y="502" font-family="Arial, sans-serif" font-size="12" fill="#0C447C">confirmed by a person</text>

</svg>
